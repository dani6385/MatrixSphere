name: MatrixSphere App Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Project for Capacitor
        run: |
          mkdir -p dist
          cp -r public/* dist/

      - name: Create Web Redirect Directory
        run: |
          mkdir -p web-redirect
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MatrixSphere - Redirecting</title></head><body><p style="text-align:center;margin-top:50px;font-family:sans-serif;">Menghubungkan ke MatrixSphere Shop...</p><script>window.location.href="https://matrixsphere-shop.web.app/" + window.location.search;</script></body></html>' > web-redirect/index.html

      - name: Deploy Redirect to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-redirect

      # PENGONDISIAN: Membuat platform dari nol jika bersih, atau singkronisasi jika sudah siap
      - name: Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Membangun platform Android baru di server cloud..."
            npx cap add android
          else
            echo "Sinkronisasi komponen Android..."
            npx cap sync android
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ==================== FITUR AUTO INCREMENT VERSION (DITARUH DI SINI) ====================
      - name: Set Version Code and Name
        run: |
          # Menggunakan nomor build GitHub sebagai Version Code (harus angka)
          # Menggunakan format 1.0.BUILD_NUMBER sebagai Version Name
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          
          # Mengganti nilai di build.gradle secara otomatis sebelum dirakit
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          
          echo "Membangun Aplikasi dengan Versi: $VERSION_NAME ($VERSION_CODE)"
      # =========================================================================================

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          cd app/build/outputs/apk/debug/
          mv app-debug.apk MatrixSphere.apk

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixSphere-APK-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/MatrixSphere.apk