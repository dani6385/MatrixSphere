name: Flutter Web Deployment (Single Project)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Environment Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Mengambil dependensi package
      - name: Get Dependencies
        run: flutter pub get

      # 4. Melakukan Kompilasi Build Web
      - name: Build Flutter Web Release
        run: flutter build web --release

      # 5. Autentikasi Google Cloud (Untuk Firebase Hosting)
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'

      # 6. Mengirim hasil build ke Firebase Hosting
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project "matrixsphere-c3de9"

      # 7. Menyimpan arsip hasil build (Opsional)
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-output
          path: build/web/