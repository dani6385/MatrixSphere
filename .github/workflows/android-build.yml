name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Web Dummy Directory
        run: |
          mkdir -p dist
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://matrixsphere-shop.web.app"></head><body>Redirecting to shop...</body></html>' > dist/index.html

      # STRATEGI PAMUNGKAS: Hapus paksa folder android di cloud jika ada, lalu generate ulang dari nol secara bersih!
      - name: Initialize Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixSphere-Shop-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk