name: Build Android APK (Capacitor) & Deploy Web Redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # --- LANGKAH 1: BUILD UNTUK KEBUTUHAN APK (MENGHASILKAN FOLDER DIST) ---
      - name: Build Web Project for Capacitor
        run: |
          npm run build # Folder 'dist' asli tercipta di sini untuk disinkronkan ke Android

      # --- LANGKAH 2: BUAT FOLDER TERPISAH KHUSUS UNTUK GITHUB PAGES ---
      # Kita buat folder 'web-redirect' agar tidak menabrak atau menghapus folder 'dist'
      - name: Create Web Redirect Directory
        run: |
          mkdir -p web-redirect
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="refresh" content="0;url=https://matrixsphere-shop.web.app/login?dst=${window.location.search}"><title>MatrixSphere - Redirecting</title></head><body><p style="text-align:center;margin-top:50px;font-family:sans-serif;">Menghubungkan ke MatrixSphere Shop...</p></body></html>' > web-redirect/index.html

      # Kirim folder 'web-redirect' ke GitHub Pages (Bukan folder 'dist')
      - name: Deploy Redirect to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-redirect # Diarahkan ke folder redirect kita

      # --- LANGKAH 3: PROSES PEMBUATAN APK SEPERTI BIASA ---
      # STRATEGI PAMUNGKAS: Hapus paksa folder android di cloud jika ada, lalu generate ulang dari nol secara bersih!
      - name: Initialize Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixSphere-Shop-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk