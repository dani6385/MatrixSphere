name: Build Android APK (Capacitor) & Deploy Web Redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # --- LANGKAH 1: KITA BUAT FOLDER DIST SECARA AMAN DENGAN MENYALIN ASET STATIS ---
      # Diganti dari 'npm run build' agar tidak error, file public disalin untuk dibungkus Capacitor ke APK
       Sirkuit Build Web Project for Capacitor
      - name: Build Web Project for Capacitor
        run: |
          mkdir -p dist
          if [ -d "public" ]; then
            cp -r public/* dist/
          else
            echo '<html><body>MatrixSphere App Ready</body></html>' > dist/index.html
          fi

      # --- LANGKAH 2: BUAT FOLDER TERPISAH KHUSUS UNTUK GITHUB PAGES ---
      # Menyisipkan variabel window.location.search dengan benar agar parameter IP & MAC dari MikroTik tidak hilang saat di-redirect
      - name: Create Web Redirect Directory
        run: |
          mkdir -p web-redirect
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MatrixSphere - Redirecting</title></head><body><p style="text-align:center;margin-top:50px;font-family:sans-serif;">Menghubungkan ke MatrixSphere Shop...</p><script>window.location.href="https://matrixsphere-shop.web.app/" + window.location.search;</script></body></html>' > web-redirect/index.html

      # Kirim folder 'web-redirect' ke GitHub Pages (Bukan folder 'dist')
      - name: Deploy Redirect to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-redirect

      # --- LANGKAH 3: PROSES PEMBUATAN APK SEPERTI BIASA ---
      # Menghapus folder android lama dan membuat ulang secara bersih berdasarkan folder 'dist' yang aman di atas
      - name: Initialize Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixSphere-Shop-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk