name: Get Android SHA1

on:
  push:
    branches: [ main, master ] # Atau sesuaikan dengan nama branch utama Anda

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Sesuaikan dengan versi Flutter Anda
          cache: true

      - name: Run Signing Report
        run: |
          cd apps/seller_sphere
          flutter pub get
          cd android
          ./gradlew signingReport