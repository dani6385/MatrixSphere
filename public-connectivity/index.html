<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatrixSphere - Connectivity</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-card">
    <img src="img/logo.png" class="logo-sphere" alt="MatrixSphere Logo">
    <h1 class="brand-title">CONNECTIVITY</h1>
    <p style="font-size: 10px; color: #64748b;">SISTEM AKSES JARINGAN TERINTEGRASI</p>

    <div class="grid-options">
        <button class="btn-tab active" onclick="switchTab('voucher', this)">Voucher</button>
        <button class="btn-tab" onclick="switchTab('member', this)">Member</button>
        <button class="btn-tab" onclick="openQR()">Scan QRIS</button>
        <button class="btn-tab">Bayar QRIS</button>
    </div>

    <button class="btn-trial" onclick="switchTab('trial', this)">⚡ COBA GRATIS (TRIAL)</button>

    <form name="login" action="#" method="post">
        <div id="voucher-form" class="input-group active">
            <p style="color: #64748b; font-size: 12px;">MASUKKAN KODE VOUCHER</p>
            <input type="text" name="username" placeholder="KODE . . .">
            <button class="btn-login">LOGIN SEKARANG &rarr;</button>
        </div>

        <div id="member-form" class="input-group">
            <p style="color: #64748b; font-size: 12px;">ID PENGGUNA</p>
            <input type="text" name="username" placeholder="ID PENGGUNA">
            <p style="color: #64748b; font-size: 12px;">PASSWORD</p>
            <input type="password" name="password" placeholder="******">
            <button class="btn-login">MASUK MEMBER</button>
        </div>

        <div id="trial-form" class="input-group">
            <div style="border: 1px solid var(--accent-green); padding: 15px; border-radius: 12px;">
                <p style="color: var(--accent-green); font-weight: bold;">AKSES TRIAL GRATIS</p>
                <p style="font-size: 11px;">Nikmati internet 30 menit gratis.</p>
                <button class="btn-login" style="background: var(--accent-green);">MULAI TRIAL</button>
            </div>
        </div>
    </form>
</div>

<div id="qr-scanner-container">
    <video id="qr-video" playsinline></video>
    <button id="close-qr-scanner" onclick="closeQR()">Close Camera</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
    function switchTab(type, el) {
        // Reset Button States
        document.querySelectorAll('.btn-tab, .btn-trial').forEach(b => b.classList.remove('active'));
        el.classList.add('active');

        // Switch Form
        document.querySelectorAll('.input-group').forEach(g => g.classList.remove('active'));
        document.getElementById(type + '-form').classList.add('active');
    }

    const qrScannerContainer = document.getElementById('qr-scanner-container');
    const video = document.getElementById('qr-video');
    let stream;

    function openQR() {
        qrScannerContainer.style.display = 'flex';
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => {
                stream = s;
                video.srcObject = stream;
                video.setAttribute("playsinline", true); // required to tell iOS safari we don't want fullscreen
                video.play();
                requestAnimationFrame(tick);
            })
            .catch(err => {
                console.error("ERROR: " + err);
                alert('Could not access camera. Please ensure you have a camera enabled and have granted permission.');
                closeQR();
            });
    }

    function closeQR() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        qrScannerContainer.style.display = 'none';
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const canvasElement = document.createElement('canvas');
        const canvas = canvasElement.getContext('2d');
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });
        if (code) {
          // QR code found!
          console.log("Found QR code", code.data);
          alert("QR Code Detected: " + code.data);
          closeQR(); // close the camera view once a code is found
          // you can now do something with the code.data, like filling a form
        }
      }
      requestAnimationFrame(tick);
    }
</script>

</body>
</html>
