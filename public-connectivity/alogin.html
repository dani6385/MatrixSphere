<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatrixSphere - Login Berhasil</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page-body">
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-left-group">
                <a href="login.html" class="nav-logo">
                    <img src="img/logo.png" alt="Logo" class="logo-img">
                    MATRIXSPHERE
                </a>
            </div>
        </nav>
    </header>

    <main class="container auth-main">
        <div class="glass-box pd-20 auth-card-container">
            <div class="login-card">
                <div class="brand-header">
                    <div style="font-size: 50px; margin-bottom: 10px;">✅</div>
                    <h1>LOGIN BERHASIL</h1>
                    <p>Selamat datang kembali, <strong>$(username)</strong></p>
                </div>

                <div class="card-body text-center">
                    <p class="auth-instruction">Anda sekarang terhubung ke koneksi internet terbaik dari MatrixSphere.</p>
                    
                    <p style="font-size: 13px; margin-top: 15px; color: var(--text-muted);">
                        Sedang mengalihkan Anda ke halaman tujuan...
                    </p>

                    <div class="mr-t-20">
                        <a href="status.html" id="redirectLink" class="btn bg-primary pd-12 radius-5 text-white btn-start-browsing">
                            LANJUT BROWSING
                        </a>
                    </div>
                </div>

                <div class="footer-text mr-t-20">
                    <p>© 2025 MatrixSphere Network Solutions.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="text/javascript">
        // Ambil nama user dari variabel MikroTik
        var currentUser = "$(username)";
        
        // Tentukan target redirect: Jika admin ke web app, jika bukan ke status.html
        var targetUrl = (currentUser === "admin") 
            ? "https://matrixsphere-shop.web.app/admin/produk.html" 
            : "status.html";

        // Update link pada tombol secara instan
        document.getElementById('redirectLink').href = targetUrl;

        // Jalankan pengalihan otomatis setelah 2 detik
        setTimeout(function() {
            window.location.href = targetUrl;
        }, 2000);
    </script>
</body>

</html>
