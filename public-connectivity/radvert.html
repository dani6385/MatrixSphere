<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="$(adv-time); url=$(link-orig)">
    <title>MatrixSphere - Iklan Layanan</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page-body">
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-left-group">
                <a href="login.html" class="nav-logo">
                    <img src="img/logo.png" alt="Logo" class="logo-img">
                    MATRIXSPHERE
                </a>
            </div>
        </nav>
    </header>

    <main class="container auth-main">
        <div class="glass-box pd-20 auth-card-container" style="max-width: 600px;">
            <div class="login-card" style="max-width: 100%;">
                <div class="brand-header">
                    <h1>IKLAN LAYANAN</h1>
                    <p>Sponsor Jaringan MatrixSphere</p>
                </div>

                <div class="card-body text-center">
                    <div class="mr-b-20">
                        <!-- Area Iklan MikroTik -->
                        <a href="$(adv-link)" target="_blank">
                            <img src="$(adv-src)" alt="Advertisement" style="max-width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                        </a>
                    </div>

                    <p class="auth-instruction">Halaman ini akan dialihkan secara otomatis dalam <strong>$(adv-time)</strong> detik...</p>

                    <div class="mr-t-20">
                        <a href="$(link-orig)" class="btn bg-primary pd-12 radius-5 text-white btn-start-browsing">
                            LANJUT KE TUJUAN
                        </a>
                    </div>
                </div>

                <div class="footer-text mr-t-20">
                    <p>© 2025 MatrixSphere. Powering Modern Connectivity.</p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
