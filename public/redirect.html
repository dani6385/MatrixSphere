<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="600">
    <title>MatrixSphere - Status Koneksi</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page-body">
    <main class="redirect-main">
        <div class="loader-card">
            <div class="spinner"></div>
            <div class="text-loading">Menghubungkan</div>
            <p style="font-size: 14px; opacity: 0.8;">Mohon tunggu sebentar, Anda sedang dialihkan ke tujuan...</p>
            
            <a href="$(dst)" class="manual-link">Klik di sini jika tidak beralih otomatis</a>
        </div>
    </main>

    <meta http-equiv="refresh" content="3; url=$(dst)">

    <script>
        // Logika tambahan: Jika ingin mendeteksi admin sebelum redirect
        async function checkAdmin() {
            const isAdmin = "$(username)" === "admin"; // Membaca variabel user MikroTik
            if (isAdmin) {
                console.log("Admin terdeteksi, menyiapkan akses gudang...");
            }
        }
        checkAdmin();
    </script>
</body>
</html>
