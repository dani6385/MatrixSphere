<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatrixSphere - Terjadi Kesalahan</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page-body">
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-left-group">
                <a href="login.html" class="nav-logo">
                    <img src="img/logo.png" alt="Logo" class="logo-img">
                    MATRIXSPHERE
                </a>
            </div>
        </nav>
    </header>

    <main class="container auth-main">
        <div class="glass-box pd-20 auth-card-container">
            <div class="login-card">
                <div class="brand-header">
                    <div style="font-size: 50px; margin-bottom: 10px;">⚠️</div>
                    <h1>TERJADI KESALAHAN</h1>
                    <p>Maaf, permintaan Anda tidak dapat diproses.</p>
                </div>

                <div class="card-body text-center">
                    <div class="bg-danger pd-10 radius-5 mr-b-20" style="font-size: 14px; line-height: 1.6;">
                        <strong>Pesan:</strong><br>
                        $(error)
                    </div>

                    <p class="auth-instruction">Silakan periksa kembali koneksi atau kredensial Anda dan coba lagi.</p>

                    <div class="mr-t-20">
                        <a href="auth.html" class="btn bg-primary pd-12 radius-5 text-white btn-start-browsing">
                            KEMBALI KE HALAMAN LOGIN
                        </a>
                    </div>
                </div>

                <div class="footer-text mr-t-20">
                    <p>© 2025 MatrixSphere Network Solutions.</p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
