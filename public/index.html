<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gudang Produk - MatrixSphere</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Pustaka untuk memproses QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>

<body class="auth-page-body">
    <div class="auth-wrapper">
        <header class="main-header">
            <div class="nav-container">
                <a href="#" class="nav-logo">
                    <img src="img/logo.png" alt="Logo">
                    <span class="brand-text">MatrixSphere</span>
                </a>
            </div>
        </header>

        <main class="container auth-main">
            <div class="login-card-wrapper">
                <div class="central-logo">
                    <img src="img/logo_shop.png" alt="Central Logo">
                </div>

                <div class="title-section">
                    <h1>CONNECTIVITY</h1>
                    <p>SISTEM AKSES JARINGAN TERINTEGRASI</p>
                </div>

                <div class="login-options">
                    <button type="button" class="option-btn active" data-type="voucher">
                        <i class="fas fa-ticket-alt"></i> VOUCHER
                    </button>
                    <button type="button" class="option-btn" data-type="member">
                        <i class="fas fa-user"></i> MEMBER
                    </button>
                    <button type="button" class="option-btn" data-type="scan">
                        <i class="fas fa-qrcode"></i> SCAN QRIS
                    </button>
                    <button type="button" class="option-btn" data-type="pay">
                        <i class="fas fa-credit-card"></i> BAYAR QRIS
                    </button>
                </div>

                <div class="trial-option">
                    <button type="button" class="trial-btn" data-type="trial">
                        <i class="fas fa-bolt"></i> COBA GRATIS (TRIAL)
                    </button>
                </div>
                
                <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()" class="login-form">
                    <input type="hidden" name="dst" value="$(link-orig)" />
                    <input type="hidden" name="popup" value="true" />
                    <input type="hidden" id="chap-id" name="chapId" value="$(chap-id)">
                    <input type="hidden" id="chap-challenge" name="chapChallenge" value="$(chap-challenge)">
                    
                    <div id="input-area">
                        <!-- Konten dinamis akan dimuat di sini oleh JavaScript -->
                    </div>
                </form>

                <div class="footer-text">
                    &copy; 2024 MatrixSphere Network.
                </div>
            </div>
        </main>
    </div>

    <script type="text/javascript" src="js/md5.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
</body>

</html>
