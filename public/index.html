<html>

<head>
    <title>Spehere Shop</title>
</head>

<body>
    <h1>MatrixSpehere Shop</h1>
    <script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
    <script>
        // Menggunakan Capacitor via script injection atau bundler frontend Anda
        // Kode ini aman berjalan di HP pembeli karena tidak dieksekusi di server Node.js
        document.addEventListener('ionBackButton', (ev) => {
            ev.detail.register(10, () => {
                if (window.location.pathname === '/' || window.location.pathname === '/login') {
                    navigator['app'].exitApp();
                } else {
                    window.history.back();
                }
            });
        });
        window.onload = function () {
            // 1. Ambil data parameter dari URL yang dikirim oleh MikroTik
            const urlParams = new URLSearchParams(window.location.search);
            const mac = urlParams.get('mac') || '';
            const ip = urlParams.get('ip') || '';
            const dst = urlParams.get('dst') || '';

            // 2. Format URL Deep Link unik aplikasi Anda
            // Mengirim parameter agar aplikasi tahu siapa perangkat yang sedang meminta akses
            const appDeepLink = `matrixsphere://login?mac=${mac}&ip=${ip}&dst=${encodeURIComponent(dst)}`;
            const playStoreUrl = "https://play.google.com/store/apps/details?id=com.matrixsphere.shop";

            // 3. Eksekusi pengalihan otomatis ke aplikasi
            window.location.href = appDeepDeepLink;

            // Fallback: Jika dalam 2.5 detik aplikasi tidak merespon/belum terinstal, arahkan ke Play Store
            setTimeout(function () {
                if (!document.webkitHidden && !document.hidden) {
                    window.location.href = playStoreUrl;
                }
            }, 2500);
        };
    </script>
</body>

</html>
