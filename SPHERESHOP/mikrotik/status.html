
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixSphere Hotspot - Status</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <img src="img/logo.png" alt="Logo" class="logo">
            <h2>Connection Status</h2>
            <div class="kotak-info-hotspot">
              <h3>Your Voucher Connection Status</h3>
              <p id="status-koneksi">Connected to MatrixSphere Hotspot</p>
              
              <p>Data Usage: <strong id="tampilan-kuota">Loading...</strong></p>
              <p>Time Remaining: <strong id="tampilan-waktu">Loading...</strong></p>
            </div>
            <br>
            <form action="$(link-logout)" name="logout">
                <button type="submit">Logout</button>
            </form>
            <div class="trial">
                <p>Logged in as: $(username)</p>
                <p>IP Address: $(ip)</p>
                <p>MAC Address: $(mac)</p>
            </div>
        </div>
    </div>
    
    <script>
      function formatBytes(bytes, decimals = 2) {
          if (bytes === 0) return '0 Bytes';
          const k = 1024;
          const dm = decimals < 0 ? 0 : decimals;
          const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
      }

      function formatTime(seconds) {
          if (isNaN(seconds) || seconds < 0) {
              return "N/A";
          }
          let d = Math.floor(seconds / (3600*24));
          let h = Math.floor(seconds % (3600*24) / 3600);
          let m = Math.floor(seconds % 3600 / 60);
          let s = Math.floor(seconds % 60);

          let dDisplay = d > 0 ? d + (d == 1 ? " day, " : " days, ") : "";
          let hDisplay = h > 0 ? h + (h == 1 ? " hour, " : " hours, ") : "";
          let mDisplay = m > 0 ? m + (m == 1 ? " minute, " : " minutes, ") : "";
          let sDisplay = s > 0 ? s + (s == 1 ? " second" : " seconds") : "";
          
          if (d > 0) return dDisplay + hDisplay;
          if (h > 0) return hDisplay + mDisplay;
          if (m > 0) return mDisplay + sDisplay;
          return sDisplay;
      }


      function cekStatusHotspot() {
        fetch('$(link-status)')
          .then(response => response.json())
          .then(data => {
            console.log("Data from MikroTik:", data);
      
            if (data.login === false) {
                 window.location.href = './login.html';
                 return;
            }

            // Quota Display
            if(data["bytes-out-total"]) { // using total bytes instead of remaining
                const sisaGB = formatBytes(data["bytes-out-total"]);
                document.getElementById("tampilan-kuota").innerText = sisaGB;
            } else if (data["limit-bytes-total"]){
                const sisaGB = formatBytes(data["limit-bytes-total"] - data["bytes-out-total"]);
                 document.getElementById("tampilan-kuota").innerText = sisaGB + " Remaining";
            }
             else {
                document.getElementById("tampilan-kuota").innerText = "Unlimited";
            }
      
            // Time Display
            if(data["session-time-left"]) {
                const sisaWaktu = formatTime(data["session-time-left"]);
                document.getElementById("tampilan-waktu").innerText = sisaWaktu;
            } else {
                 document.getElementById("tampilan-waktu").innerText = "Unlimited";
            }
          })
          .catch(error => {
              console.error('Error fetching status:', error);
              document.getElementById("tampilan-kuota").innerText = "Error";
              document.getElementById("tampilan-waktu").innerText = "Error";
          });
      }
      
      // Refresh status every 10 seconds
      window.onload = () => {
        cekStatusHotspot();
        setInterval(cekStatusHotspot, 10000);
      };
    </script>
</body>
</html>
