
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixSphere Hotspot</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/md5.js"></script>
</head>
<body>
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>
    <script>
        function doLogin() {
            var chap_id = "$(chap-id)";
            var chap_challenge = "$(chap-challenge)";
            var username = document.login.username.value;
            var password = document.login.password.value;
            
            // Encrypt password with MD5 if chap-id is set
            if (chap_id) {
                document.sendin.password.value = hex_md5(chap_id + password + chap_challenge);
            }
            document.sendin.username.value = username;
            document.sendin.submit();

            // Redirect to the app
            window.location.href = "matrixsphere://open?username=" + username + "&password=" + password;

            return false;
        }
    </script>
    $(endif)

    <div class="container">
        <div class="login-box">
            <img src="img/logo.png" alt="Logo" class="logo">
            <h2>Hotspot Login</h2>
            <p>Please log in to access the internet.</p>
            <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                <input type="hidden" name="dst" value="$(link-orig)" />
                <input type="hidden" name="popup" value="true" />

                <div class="input-group">
                    <input type="text" name="username" value="$(username)" required>
                    <label>Username</label>
                </div>
                <div class="input-group">
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>
                <button type="submit">Login</button>
            </form>
            $(if error)
            <div class="error">
                <p>$(error)</p>
            </div>
            $(endif)
            <div class="trial">
                <p>New user? <a href="$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)">Click here for a free trial.</a></p>
            </div>
        </div>
    </div>
</body>
</html>
